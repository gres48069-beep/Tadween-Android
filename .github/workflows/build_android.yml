name: Build Tadween Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Set App Display Name
        run: sed -i 's/android:label="[^"]*"/android:label="تدوين"/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-shrink --verbose

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk tadween.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tadween-android-apk
          path: tadween.apk
